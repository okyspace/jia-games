<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Memory Match</title>
  <link rel="stylesheet" href="../../css/kit.css" />
  <link rel="stylesheet" href="../game.css" />
  <style>
    .cards { display: grid; gap: 10px; grid-template-columns: repeat(var(--cols), 1fr); max-width: 560px; margin: 0 auto; width: 100%; }
    .mcard { aspect-ratio: 3 / 4; perspective: 600px; border: none; background: none; padding: 0; cursor: pointer; }
    .mcard .inner { position: relative; width: 100%; height: 100%; transition: transform 0.35s; transform-style: preserve-3d; }
    .mcard.up .inner, .mcard.matched .inner { transform: rotateY(180deg); }
    .mcard .face {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      border: var(--line);
      border-radius: 16px;
      box-shadow: var(--pop-small);
      backface-visibility: hidden;
      font-size: clamp(28px, 9vw, 52px);
    }
    .mcard .back {
      background: repeating-linear-gradient(45deg, var(--pink) 0 12px, #ff8fb5 12px 24px);
      color: #fff;
      font-size: clamp(22px, 6vw, 34px);
    }
    .mcard .front { background: #fff; transform: rotateY(180deg); }
    .mcard.matched .front { background: #d4f7c5; }
  </style>
</head>
<body>
  <div class="game" id="game"></div>
  <script type="module" src="memory.js"></script>
</body>
</html>
