<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mouse Maze</title>
  <link rel="stylesheet" href="../../css/kit.css" />
  <link rel="stylesheet" href="../game.css" />
  <style>
    .board {
      position: relative;
      width: min(100%, 70dvh);
      aspect-ratio: 1;
      margin: 0 auto;
      border: var(--line);
      border-radius: var(--radius);
      box-shadow: var(--pop);
      background: #e9fbd9;
      overflow: hidden;
      touch-action: none;
    }
    .board canvas { width: 100%; height: 100%; display: block; }
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 70px);
      grid-template-rows: repeat(2, 64px);
      gap: 8px;
      justify-content: center;
    }
    .dpad .key { font-size: 28px; }
    .dpad .up { grid-column: 2; }
    .dpad .left { grid-column: 1; grid-row: 2; }
    .dpad .down { grid-column: 2; grid-row: 2; }
    .dpad .right { grid-column: 3; grid-row: 2; }
    .key {
      border: var(--line);
      border-radius: 18px;
      background: #fff;
      box-shadow: var(--pop-small);
      font-weight: 700;
      cursor: pointer;
    }
    .key:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  </style>
</head>
<body>
  <div class="game">
    <div class="hud">
      <span class="pill" id="level">Level 1</span>
      <span class="pill" id="moves">👣 0</span>
      <span class="pill" id="time">⏱️ 0:00</span>
      <span class="pill" id="best">🏅 Best: 1</span>
    </div>
    <div class="board" id="board"><canvas id="canvas" aria-label="Maze"></canvas></div>
    <p class="center hint">Use the arrows, your keyboard, or swipe on the maze.</p>
    <div class="dpad">
      <button class="key up" data-dir="up" aria-label="Up">⬆️</button>
      <button class="key left" data-dir="left" aria-label="Left">⬅️</button>
      <button class="key down" data-dir="down" aria-label="Down">⬇️</button>
      <button class="key right" data-dir="right" aria-label="Right">➡️</button>
    </div>
  </div>
  <script type="module" src="maze.js"></script>
</body>
</html>
