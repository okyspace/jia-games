name: CI

# For now this runs only for the ideation branch (and can be started by hand from the Actions tab).
on:
  push:
    branches: [ideation]
  workflow_dispatch:

jobs:
  quality:
    name: Quality check (ESLint + Playwright tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ESLint (JavaScript)
        run: npm run lint
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/

  android:
    name: Android Lint + debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the ideation-latest pre-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Android Lint (Kotlin/Android)
        working-directory: android
        run: ./gradlew --no-daemon lintDebug
      - name: detekt (Kotlin static analysis)
        working-directory: android
        run: ./gradlew --no-daemon detekt
      - name: Kotlin unit tests (ViewModels, data layer, game engine)
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: jia-games-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            android/app/build/reports/lint-results-debug.*
            android/app/build/reports/detekt/
            android/app/build/reports/tests/
          if-no-files-found: ignore
      # Fixed one-tap download link for the newest ideation build:
      # https://github.com/okyspace/jia-games/releases/download/ideation-latest/jia-games.apk
      - name: Publish "ideation-latest" pre-release
        if: github.ref == 'refs/heads/ideation'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk jia-games.apk
          gh release delete ideation-latest --cleanup-tag --yes || true
          gh release create ideation-latest jia-games.apk \
            --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Latest ideation build (test APK)" \
            --notes "Debug APK built from ideation commit ${GITHUB_SHA::7}. Replaced on every push to ideation."
