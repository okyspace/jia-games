name: CI

# For now this runs only for the ideation branch (and can be started by hand from the Actions tab).
on:
  push:
    branches: [ideation]
  workflow_dispatch:

jobs:
  quality:
    name: Quality check (ESLint + Playwright tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ESLint (JavaScript)
        run: npm run lint
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/

  android:
    name: Android Lint + debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Android Lint (Kotlin/Android)
        working-directory: android
        run: ./gradlew --no-daemon lintDebug
      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: jia-games-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
